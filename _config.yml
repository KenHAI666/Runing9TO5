# 全站基本設定
title: "K叔｜Threads 內容變現"
description: "K叔幫有商品、服務或專業的人，把 Threads 內容變成信任與詢問。"
baseurl: ""
url: "https://runing9to5.com"
lang: "zh-Hant"
timezone: "Asia/Taipei"
# 未來日期的文章不發布，排程由每日 GitHub Actions 建置釋出
future: false

author:
  name: "K叔｜不想上班的貓"
  avatar: "/assets/images/me.jpeg"
  email: "hi@runing9to5.com"
  bio: "幫有商品、服務或專業的人，把 Threads 內容變成信任與詢問。"

brand:
  name: "RUNING_9to5"
  legal_name: "Runing9TO5"
  email: "hi@runing9to5.com"
  logo: "/assets/images/favicon.png"
  default_image: "/assets/images/og-default.jpg"

social:
  threads: "https://www.threads.net/@runing_9to5"
  instagram: "https://www.instagram.com/runing_9to5/"
  portaly: "https://portaly.cc/Uncleken"

ads:
  enabled: false
  client: "ca-pub-4979322196093081"
  slot_top: ""
  slot_bottom: ""

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-redirect-from

# 全站導覽列
nav:
  - name: "首頁"
    link: "/"
  - name: "文章"
    link: "/articles"
  - name: "找我諮詢"
    link: "/contact"
  - name: "免費資源"
    link: "/free"

# SEO 專用設定
seo:
  type: "website"
  title: "K叔｜把 Threads 內容變成信任與詢問"
  description: "從定位、內容到成交路徑，K叔幫有商品、服務或專業的人，把 Threads 內容變成信任與詢問。"
  locale: "zh_TW"
  image: "/assets/images/og-default.jpg"
  twitter: false
  facebook: false

# 不輸出到網站的開發檔案
exclude:
  - README.md
  - README.html
  - templates/
  - scripts/
  - vendor/
  - Gemfile
  - Gemfile.lock

# Sitemap 與 Feed
feed:
  path: feed.xml

sitemap:
  exclude:
    - "/assets/"
    - "/drafts/"
  include_posts: true
