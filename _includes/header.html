<header class="site-header">
  <nav class="fixed-nav" aria-label="主要導覽">
    <a href="{{ '/' | relative_url }}" class="logo" aria-label="回到 K叔首頁">
      <span class="logo-mark" aria-hidden="true">K</span>
      <span class="logo-copy">
        <span class="logo-name">K叔</span>
        <span class="logo-sub">@runing_9to5 · 不想上班的貓</span>
      </span>
    </a>

    <button class="hamburger" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="開啟導覽選單">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="nav-links" id="navLinks">
      {% for item in site.nav %}
        <a href="{{ item.link | relative_url }}"
           {% if item.new_window %}target="_blank" rel="noopener noreferrer"{% endif %}>
          {{ item.name }}
        </a>
      {% endfor %}
    </div>
  </nav>
</header>
<div class="nav-spacer" aria-hidden="true"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const hamburger = document.querySelector(".hamburger");
    const navLinks = document.getElementById("navLinks");
    if (!hamburger || !navLinks) return;

    hamburger.addEventListener("click", function () {
      const isOpen = navLinks.classList.toggle("active");
      hamburger.setAttribute("aria-expanded", String(isOpen));
    });

    navLinks.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function () {
        navLinks.classList.remove("active");
        hamburger.setAttribute("aria-expanded", "false");
      });
    });
  });
</script>
